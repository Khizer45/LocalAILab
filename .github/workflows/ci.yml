name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly: catch new vulnerability advisories even without commits

permissions:
  contents: read

jobs:
  backend:
    name: Backend ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # The primary target is Windows 10/11 with Python 3.11. This job has not been run by the
          # developers yet – treat its first results with care and report problems.
          - os: windows-latest
            python: "3.11"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests (uses the built-in Ollama simulator, no models needed)
        run: pytest -q

  supply-chain:
    name: Dependency audit + licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt pip-audit
      - name: Known vulnerabilities in Python dependencies
        run: pip-audit -r backend/requirements.txt --strict
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Known vulnerabilities in shipped JavaScript dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Licence report (fails on GPL/AGPL runtime dependencies)
        run: python scripts/license_report.py --output THIRD_PARTY_LICENSES.md
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.md

  frontend:
    name: Frontend typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  e2e:
    name: End-to-end (API smoke + browser, simulator)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Start simulator and backend (serves the built UI)
        working-directory: backend
        run: |
          python -m devtools.fake_ollama --port 11500 --speed 0 &
          mkdir -p /tmp/lab-data/workspace
          OLLAMA_BASE_URL=http://127.0.0.1:11500 DATA_DIR=/tmp/lab-data EMBEDDING_MODEL=sim-embed \
            DEFAULT_MODEL=sim-small:1b uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
      - run: python scripts/smoke_test.py --base-url http://127.0.0.1:8000 --model sim-small:1b
      - name: Browser tests (Playwright)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose build
