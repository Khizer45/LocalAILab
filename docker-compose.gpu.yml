# NVIDIA GPU for the Ollama container (needs the NVIDIA Container Toolkit /
# Docker Desktop with WSL2 GPU support):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
