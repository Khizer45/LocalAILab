# Development use only: the application upgrades its database automatically at
# start-up (app/db/migrate.py). To create a new migration after changing a model:
#   alembic -c alembic.ini revision --autogenerate -m "describe the change"
[alembic]
script_location = app/db/migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./data/dev_migrations.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
